<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>GamePad Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none; user-select: none;
}
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --muted: #555568;
  --accent: #6c63ff;
  --xbox-y: #f5c518;
  --xbox-x: #3b82f6;
  --xbox-b: #ef4444;
  --xbox-a: #22c55e;
  --stick-bg: #1e1e2e;
  --stick-knob: #2a2a40;
  --stick-active: #3a3a55;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); }
body {
  display: flex; flex-direction: column;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
}

/* ── FULLSCREEN BANNER ── */
#fs-banner {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #0a0a1a 0%, #12122a 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; transition: opacity .4s, visibility .4s;
}
#fs-banner.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#fs-banner h2 { font-size: 22px; font-weight: 700; color: var(--text); }
#fs-banner p { font-size: 14px; color: var(--muted); max-width: 280px; text-align: center; }
#fs-enter {
  background: var(--accent); color: #fff; border: none; border-radius: 14px;
  padding: 14px 40px; font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: inherit; letter-spacing: .5px;
  box-shadow: 0 4px 20px #6c63ff44;
  transition: transform .1s;
}
#fs-enter:active { transform: scale(.95); }

/* ── TOP BAR ── */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 8px; flex-shrink: 0; min-height: 40px;
}
#status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #ff3344; flex-shrink: 0; transition: background .3s;
}
#status-dot.on { background: #33ff88; box-shadow: 0 0 8px #33ff8866; }
#player-badge {
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px; letter-spacing: .5px;
}
#profile-select {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 600;
  border-radius: 8px; padding: 4px 8px; flex: 1; max-width: 160px;
  appearance: none; text-align: center; font-family: inherit;
}
.top-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; font-weight: 700;
  border-radius: 8px; padding: 4px 10px; cursor: pointer;
  font-family: inherit; letter-spacing: .5px; white-space: nowrap;
}

/* ── SHOULDERS ── */
#shoulders {
  display: flex; justify-content: space-between; padding: 4px 10px; flex-shrink: 0;
}
.shoulder-group { display: flex; gap: 4px; }
.sh-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted); font-size: 11px; font-weight: 700;
  padding: 8px 18px; cursor: pointer; letter-spacing: .5px;
  transition: all .07s; text-align: center; font-family: inherit;
}
.sh-btn.pressed { background: #6c63ff33; border-color: var(--accent); color: #fff; transform: scale(.95); }

/* ── MAIN GAME AREA ── */
#game {
  flex: 1; display: flex; align-items: stretch; justify-content: space-between;
  padding: 6px 10px; gap: 4px; overflow: hidden; position: relative;
}

/* ── LEFT ZONE (Stick + DPad) ── */
.left-zone {
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; flex-shrink: 0; width: 42%;
  padding: 4px 0;
}

/* ── RIGHT ZONE (Buttons + Stick) ── */
.right-zone {
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; flex-shrink: 0; width: 42%;
  padding: 4px 0;
}

/* ── CENTER ZONE ── */
.center-zone {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; flex-shrink: 0;
}

/* ── ANALOG STICK ── */
.stick-container {
  position: relative; width: 120px; height: 120px;
  background: var(--stick-bg);
  border-radius: 50%; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.4);
}
.stick-knob {
  width: 56px; height: 56px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #3a3a55, #22222e);
  border: 2px solid #3a3a55;
  box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 1px 3px rgba(255,255,255,.05);
  position: absolute; cursor: grab;
  transition: box-shadow .1s;
}
.stick-knob.active {
  box-shadow: 0 0 16px #6c63ff44, 0 2px 8px rgba(0,0,0,.5);
  border-color: var(--accent);
}
.stick-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: 1px;
}

/* ── D-PAD ── */
#dpad {
  position: relative; width: 120px; height: 120px; flex-shrink: 0;
}
.dp {
  position: absolute; background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted);
  transition: all .05s;
}
.dp.pressed { background: #6c63ff33; border-color: var(--accent); color: #fff; transform: scale(.92); }
#dp-up    { width: 38px; height: 38px; top: 0;    left: 41px; border-radius: 6px 6px 2px 2px; }
#dp-down  { width: 38px; height: 38px; bottom: 0; left: 41px; border-radius: 2px 2px 6px 6px; }
#dp-left  { width: 38px; height: 38px; top: 41px; left: 0;    border-radius: 6px 2px 2px 6px; }
#dp-right { width: 38px; height: 38px; top: 41px; right: 0;   border-radius: 2px 6px 6px 2px; }
#dp-mid   { width: 38px; height: 38px; top: 41px; left: 41px; background: var(--surface); border-radius: 4px; }

/* ── XBOX FACE BUTTONS (Diamond Layout) ── */
#face-buttons {
  position: relative; width: 140px; height: 140px; flex-shrink: 0;
}
.face-btn {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  border: 2.5px solid; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; cursor: pointer;
  transition: transform .07s, opacity .07s;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
  font-family: inherit;
}
.face-btn.pressed { transform: scale(.82); opacity: .7; }

#btn-y { top: 0; left: 44px; border-color: var(--xbox-y); color: var(--xbox-y); }
#btn-x { top: 44px; left: 0; border-color: var(--xbox-x); color: var(--xbox-x); }
#btn-b { top: 44px; right: 0; border-color: var(--xbox-b); color: var(--xbox-b); }
#btn-a { bottom: 0; left: 44px; border-color: var(--xbox-a); color: var(--xbox-a); }

/* ── SYSTEM BUTTONS ── */
.sys-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 50px; color: var(--muted); font-size: 9px; font-weight: 700;
  padding: 5px 10px; cursor: pointer; font-family: inherit;
  letter-spacing: .5px; transition: all .07s;
}
.sys-btn.pressed { background: #ffffff18; color: #fff; }

.home-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; transition: all .1s;
}
.home-btn:active { border-color: var(--accent); background: #6c63ff22; }

/* ── BOTTOM BAR ── */
#bottombar {
  display: flex; align-items: center; justify-content: center;
  padding: 4px 10px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0;
  gap: 6px; min-height: 32px;
}
#bottombar .info { font-size: 10px; color: var(--muted); font-weight: 600; }
#connected-count { color: var(--accent); font-weight: 700; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; font-weight: 500;
  padding: 8px 18px; border-radius: 20px;
  opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none; z-index: 200; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Landscape lock hint ── */
@media (orientation: portrait) {
  #rotate-hint {
    position: fixed; inset: 0; z-index: 10000;
    background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  #rotate-hint .icon { font-size: 48px; animation: rotate-anim 2s ease-in-out infinite; }
  #rotate-hint p { font-size: 16px; color: var(--muted); font-weight: 600; }
}
@media (orientation: landscape) {
  #rotate-hint { display: none !important; }
}
@keyframes rotate-anim {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
</style>
</head>
<body>

<!-- Rotate hint for portrait -->
<div id="rotate-hint">
  <div class="icon">📱</div>
  <p>Rotate your phone to landscape</p>
</div>

<!-- Fullscreen banner -->
<div id="fs-banner">
  <h2>🎮 GamePad Controller</h2>
  <p>Enter fullscreen for the best gaming experience on your phone</p>
  <button id="fs-enter">Enter Fullscreen & Play</button>
  <p style="font-size:11px; color:#444; margin-top:8px; cursor:pointer;" id="fs-skip">Skip →</p>
</div>

<!-- Top Bar -->
<div id="topbar">
  <span id="status-dot"></span>
  <span id="player-badge">P1</span>
  <select id="profile-select"></select>
  <button class="top-btn" id="fs-toggle">⛶</button>
  <a id="qr-link" href="/qr" target="_blank" class="top-btn" style="text-decoration:none;color:var(--muted);">QR</a>
</div>

<!-- Shoulders -->
<div id="shoulders">
  <div class="shoulder-group">
    <div class="sh-btn" data-btn="l2">LT</div>
    <div class="sh-btn" data-btn="l1">LB</div>
  </div>
  <div class="shoulder-group">
    <div class="sh-btn" data-btn="r1">RB</div>
    <div class="sh-btn" data-btn="r2">RT</div>
  </div>
</div>

<!-- Main Game Area -->
<div id="game">

  <!-- LEFT: Stick on top, D-Pad below -->
  <div class="left-zone">
    <div class="stick-container" id="stick-left-zone">
      <div class="stick-knob" id="stick-left"></div>
      <span class="stick-label">L STICK</span>
    </div>
    <div id="dpad">
      <div class="dp" id="dp-up"    data-btn="up">▲</div>
      <div class="dp" id="dp-left"  data-btn="left">◀</div>
      <div class="dp" id="dp-mid"></div>
      <div class="dp" id="dp-right" data-btn="right">▶</div>
      <div class="dp" id="dp-down"  data-btn="down">▼</div>
    </div>
  </div>

  <!-- CENTER: System buttons -->
  <div class="center-zone">
    <div class="sys-btn" data-btn="select">BACK</div>
    <div class="home-btn" id="home-btn" data-btn="home">⊕</div>
    <div class="sys-btn" data-btn="start">START</div>
  </div>

  <!-- RIGHT: XYBA on top, Right Stick below -->
  <div class="right-zone">
    <div id="face-buttons">
      <div class="face-btn" id="btn-y" data-btn="triangle">Y</div>
      <div class="face-btn" id="btn-x" data-btn="square">X</div>
      <div class="face-btn" id="btn-b" data-btn="circle">B</div>
      <div class="face-btn" id="btn-a" data-btn="cross">A</div>
    </div>
    <div class="stick-container" id="stick-right-zone">
      <div class="stick-knob" id="stick-right"></div>
      <span class="stick-label">R STICK</span>
    </div>
  </div>

</div>

<!-- Bottom info bar -->
<div id="bottombar">
  <span class="info">Connected: <span id="connected-count">0</span> players</span>
  <span class="info">•</span>
  <span class="info" id="profile-name">—</span>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════════ */
let ws, profiles = [], activeProfile = 'tekken', playerId = 'P1';

/* ═══════════════════════════════════════════════════════════════════
   FULLSCREEN
   ═══════════════════════════════════════════════════════════════════ */
function enterFS() {
  const el = document.documentElement;
  const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (rfs) rfs.call(el).catch(() => {});
  // Lock to landscape if supported
  try { screen.orientation.lock('landscape').catch(() => {}); } catch(e) {}
  document.getElementById('fs-banner').classList.add('hidden');
}

document.getElementById('fs-enter').addEventListener('click', enterFS);
document.getElementById('fs-skip').addEventListener('click', () => {
  document.getElementById('fs-banner').classList.add('hidden');
});
document.getElementById('fs-toggle').addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    enterFS();
  }
});

// Auto-hide banner on desktop
if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) {
  document.getElementById('fs-banner').classList.add('hidden');
}

/* ═══════════════════════════════════════════════════════════════════
   WEBSOCKET
   ═══════════════════════════════════════════════════════════════════ */
function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    document.getElementById('status-dot').classList.add('on');
    showToast('Connected!');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'init') {
        profiles = msg.profiles;
        activeProfile = msg.active;
        if (msg.playerId) {
          playerId = msg.playerId;
          document.getElementById('player-badge').textContent = playerId;
        }
        if (msg.connectedCount !== undefined) {
          document.getElementById('connected-count').textContent = msg.connectedCount;
        }
        buildProfileSelect();
        const p = profiles.find(p => p.id === activeProfile);
        if (p) document.getElementById('profile-name').textContent = p.name;
      }
      if (msg.type === 'profile') {
        activeProfile = msg.id;
        updateProfileUI();
        const p = profiles.find(p => p.id === msg.id);
        if (p) document.getElementById('profile-name').textContent = p.name;
        showToast('Profile: ' + (p?.name || msg.id));
      }
      if (msg.type === 'playerCount') {
        document.getElementById('connected-count').textContent = msg.count;
      }
    } catch(err) {}
  };

  ws.onclose = () => {
    document.getElementById('status-dot').classList.remove('on');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
}

function send(data) {
  if (ws?.readyState === 1) ws.send(JSON.stringify(data));
}

connect();

/* ═══════════════════════════════════════════════════════════════════
   BUTTON PRESS / RELEASE
   ═══════════════════════════════════════════════════════════════════ */
function attachBtn(el) {
  const btn = el.dataset.btn;
  if (!btn) return;
  const down = (e) => { e.preventDefault(); el.classList.add('pressed'); send({ type: 'button', button: btn, action: 'down' }); };
  const up = (e) => { e.preventDefault(); el.classList.remove('pressed'); send({ type: 'button', button: btn, action: 'up' }); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', (e) => { if (el.classList.contains('pressed')) up(e); });
}

document.querySelectorAll('[data-btn]').forEach(attachBtn);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ═══════════════════════════════════════════════════════════════════
   ANALOG STICKS
   ═══════════════════════════════════════════════════════════════════ */
function initStick(knobId, zoneId, stickName) {
  const knob = document.getElementById(knobId);
  const zone = document.getElementById(zoneId);
  let active = false, touchId = null;
  const maxDist = 32;

  function getCenter() {
    const r = zone.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function move(cx, cy) {
    const center = getCenter();
    let dx = cx - center.x, dy = cy - center.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    // Normalize to -1..1
    const nx = +(dx / maxDist).toFixed(2), ny = +(dy / maxDist).toFixed(2);
    send({ type: 'stick', stick: stickName, x: nx, y: ny });
  }

  function reset() {
    knob.style.transform = 'translate(0,0)';
    knob.classList.remove('active');
    send({ type: 'stick', stick: stickName, x: 0, y: 0 });
    active = false; touchId = null;
  }

  zone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchId = t.identifier; active = true;
    knob.classList.add('active');
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) { move(t.clientX, t.clientY); break; }
    }
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) { reset(); break; }
    }
  });
  document.addEventListener('touchcancel', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) { reset(); break; }
    }
  });

  // Mouse support for desktop testing
  zone.addEventListener('mousedown', (e) => {
    e.preventDefault(); active = true;
    knob.classList.add('active');
    move(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', (e) => { if (active) move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => { if (active) reset(); });
}

initStick('stick-left', 'stick-left-zone', 'left');
initStick('stick-right', 'stick-right-zone', 'right');

/* ═══════════════════════════════════════════════════════════════════
   PROFILES
   ═══════════════════════════════════════════════════════════════════ */
const profileSelect = document.getElementById('profile-select');

function buildProfileSelect() {
  profileSelect.innerHTML = '';
  profiles.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name;
    if (p.id === activeProfile) opt.selected = true;
    profileSelect.appendChild(opt);
  });
}

profileSelect.addEventListener('change', () => send({ type: 'profile', id: profileSelect.value }));

function updateProfileUI() {
  profileSelect.value = activeProfile;
}

/* ═══════════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════════ */
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
</script>
</body>
</html>
